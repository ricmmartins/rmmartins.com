baseURL: "https://rmmartins.com/"
title: "Ricardo Martins — Cloud Architecture, Azure, Kubernetes & AI"
paginate: 10
theme: PaperMod
locale: en-US
defaultContentLanguage: en
languageCode: en-US

enableGitInfo: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

taxonomies:
  tag: tags
  category: categories

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

related:
  includeNewer: true
  threshold: 80
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 80
    - name: date
      weight: 10

params:
  env: production
  title: "Ricardo Martins"
  description: "Blog about Cloud, Azure, AI and DevOps by Ricardo Martins, Principal Solutions Engineer at Microsoft. Tutorials, guides and best practices."
  keywords: [Cloud, Azure, Kubernetes, DevOps, Linux, Docker, AKS, Cloud Architecture, AI, Blog]
  author: "Ricardo Martins"
  images: ["/images/profile.png"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false

  social:
    twitter: "ricmmartins"

  schema:
    publisherType: "Person"
    sameAs:
      - "https://linkedin.com/in/ricmmartins"
      - "https://github.com/ricmmartins"
      - "https://x.com/ricmmartins"
      - "https://ricardomartins.com.br"

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"

  label:
    text: "Ricardo Martins"

  profileMode:
    enabled: true
    title: "Hey, I'm Ricardo! 👋"
    subtitle: |
      Learn. Build. Share.

      Principal Solutions Engineer @ Microsoft.
      Writing about infrastructure since 2005, cloud since 2012 and AI since 2024.
      Do things, write about it. We grow when we share!
    imageUrl: "/images/profile.png"
    imageTitle: "Ricardo Martins"
    imageWidth: 150
    imageHeight: 150
    buttons:
      - name: "📝 Posts"
        url: "/posts/"
      - name: "🚀 Projects"
        url: "/projects/"
      - name: "👤 About"
        url: "/about/"

  socialIcons:
    - name: linkedin
      url: "https://linkedin.com/in/ricmmartins"
    - name: github
      url: "https://github.com/ricmmartins"
    - name: x
      url: "https://x.com/ricmmartins"
    - name: instagram
      url: "https://www.instagram.com/ricardommartins"
    - name: link
      title: "Publications"
      url: "https://github.com/ricmmartins/activitylog"
    - name: globe
      title: "Blog em Português"
      url: "https://ricardomartins.com.br"
    - name: rss
      url: "/index.xml"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  editPost:
    URL: "https://github.com/rmmartins/rmmartins.com/tree/main/content"
    Text: "Suggest edit"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

services:
  disqus:
    shortname: "rmmartins"

menu:
  main:
    - identifier: posts
      name: "Posts"
      url: /posts/
      weight: 10
    - identifier: projects
      name: "Projects"
      url: /projects/
      weight: 20
    - identifier: tags
      name: "Tags"
      url: /tags/
      weight: 30
    - identifier: archives
      name: "Archives"
      url: /archives/
      weight: 40
    - identifier: search
      name: "Search"
      url: /search/
      weight: 50
    - identifier: about
      name: "About"
      url: /about/
      weight: 60

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai

permalinks:
  posts: "/:year/:month/:day/:slug/"

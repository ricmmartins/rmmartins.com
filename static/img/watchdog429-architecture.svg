<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="Segoe UI, Arial, sans-serif">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1e1e1e; }
      .text-main { fill: #e0e0e0; }
      .text-desc { fill: #b0b0b0; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- HOST box -->
  <rect x="120" y="20" width="260" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="250" y="48" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a3a5c" class="text-main">HOST</text>
  <text x="250" y="66" text-anchor="middle" font-size="10" fill="#555" class="text-desc">Claude / agent runtime / simple cron</text>

  <!-- Arrow HOST → MCP Server -->
  <line x1="250" y1="80" x2="250" y2="140" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="175" y="95" width="200" height="24" rx="4" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
  <text x="275" y="112" text-anchor="middle" font-size="10" fill="#555" class="text-desc">MCP (stdio or Streamable HTTP)</text>

  <!-- MCP Server box -->
  <rect x="80" y="145" width="340" height="140" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="250" y="172" text-anchor="middle" font-weight="bold" font-size="13" fill="#7a5900" class="text-main">MCP SERVER: watchdog429</text>

  <!-- Tool items -->
  <rect x="105" y="185" width="145" height="32" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="177" y="205" text-anchor="middle" font-size="11" fill="#333" class="text-main">get_token_usage_trend</text>

  <rect x="265" y="185" width="135" height="32" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="332" y="205" text-anchor="middle" font-size="11" fill="#333" class="text-main">get_token_usage_history</text>

  <rect x="105" y="230" width="145" height="32" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="177" y="250" text-anchor="middle" font-size="11" fill="#333" class="text-main">send_slack_alert</text>

  <rect x="265" y="230" width="135" height="32" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="332" y="250" text-anchor="middle" font-size="11" fill="#333" class="text-main">send_priority_alert</text>

  <!-- Labels: Telemetry reads / Notifications -->
  <text x="177" y="275" text-anchor="middle" font-size="9" fill="#555" class="text-desc">telemetry reads</text>
  <text x="332" y="275" text-anchor="middle" font-size="9" fill="#555" class="text-desc">notifications</text>

  <!-- Arrow MCP Server → Azure Monitor -->
  <line x1="250" y1="285" x2="250" y2="335" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Azure Monitor box -->
  <rect x="80" y="340" width="340" height="35" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="250" y="363" text-anchor="middle" font-weight="bold" font-size="12" fill="#2d5a1b" class="text-main">Azure Monitor (TokenTransaction, AzureOpenAIRequests)</text>
</svg>

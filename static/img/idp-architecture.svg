<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="Segoe UI, Arial, sans-serif">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1e1e1e; }
      .layer-title { fill: #e0e0e0; }
      .desc { fill: #bbb; }
    }
  </style>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="680" height="520" rx="12" fill="#f9fafb" stroke="none"/>

  <!-- DEVELOPER EXPERIENCE LAYER -->
  <rect x="20" y="20" width="640" height="120" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text class="layer-title" x="340" y="45" text-anchor="middle" font-weight="bold" font-size="13" fill="#2d5a1b">DEVELOPER EXPERIENCE</text>

  <!-- Dev Portal -->
  <rect x="50" y="60" width="160" height="55" rx="6" fill="#fff" stroke="#82b366" stroke-width="1.5"/>
  <text x="130" y="85" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">Dev Portal</text>
  <text x="130" y="102" text-anchor="middle" font-size="9" fill="#555">Self-service UI</text>

  <!-- az CLI -->
  <rect x="250" y="60" width="160" height="55" rx="6" fill="#fff" stroke="#82b366" stroke-width="1.5"/>
  <text x="330" y="85" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">az CLI</text>
  <text x="330" y="102" text-anchor="middle" font-size="9" fill="#555">Command line</text>

  <!-- IDE Extensions -->
  <rect x="450" y="60" width="190" height="55" rx="6" fill="#fff" stroke="#82b366" stroke-width="1.5"/>
  <text x="545" y="85" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">IDE Extensions</text>
  <text x="545" y="102" text-anchor="middle" font-size="9" fill="#555">VS Code</text>

  <!-- Arrows from Dev Experience to Platform -->
  <line x1="130" y1="115" x2="130" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="115" x2="330" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="115" x2="545" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PLATFORM LAYER -->
  <rect x="20" y="180" width="640" height="120" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text class="layer-title" x="340" y="205" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a3a5c">PLATFORM LAYER</text>

  <!-- Dev Center -->
  <rect x="50" y="218" width="170" height="55" rx="6" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="135" y="242" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">Dev Center</text>
  <text x="135" y="259" text-anchor="middle" font-size="9" fill="#555">Control Plane</text>

  <!-- Deployment Environments -->
  <rect x="250" y="218" width="170" height="55" rx="6" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="335" y="242" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">Deployment Env</text>
  <text x="335" y="259" text-anchor="middle" font-size="9" fill="#555">Provisioning</text>

  <!-- Azure Policy Engine -->
  <rect x="450" y="218" width="190" height="55" rx="6" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="545" y="242" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">Azure Policy</text>
  <text x="545" y="259" text-anchor="middle" font-size="9" fill="#555">Guardrails</text>

  <!-- Arrows from Platform to Infrastructure -->
  <line x1="135" y1="273" x2="135" y2="335" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="335" y1="273" x2="335" y2="335" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="273" x2="545" y2="335" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- INFRASTRUCTURE LAYER -->
  <rect x="20" y="340" width="640" height="160" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text class="layer-title" x="340" y="365" text-anchor="middle" font-weight="bold" font-size="13" fill="#7a5900">INFRASTRUCTURE LAYER</text>

  <!-- Row 1 -->
  <rect x="40" y="378" width="140" height="45" rx="6" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="110" y="400" text-anchor="middle" font-weight="bold" font-size="10" fill="#333">AKS Clusters</text>
  <text x="110" y="414" text-anchor="middle" font-size="9" fill="#555">Kubernetes</text>

  <rect x="195" y="378" width="140" height="45" rx="6" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="265" y="400" text-anchor="middle" font-weight="bold" font-size="10" fill="#333">PostgreSQL</text>
  <text x="265" y="414" text-anchor="middle" font-size="9" fill="#555">Flexible Server</text>

  <rect x="350" y="378" width="140" height="45" rx="6" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="420" y="400" text-anchor="middle" font-weight="bold" font-size="10" fill="#333">Redis</text>
  <text x="420" y="414" text-anchor="middle" font-size="9" fill="#555">Managed Cache</text>

  <rect x="505" y="378" width="140" height="45" rx="6" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="575" y="400" text-anchor="middle" font-weight="bold" font-size="10" fill="#333">Service Bus</text>
  <text x="575" y="414" text-anchor="middle" font-size="9" fill="#555">Event Hubs</text>

  <!-- Row 2 -->
  <rect x="40" y="435" width="140" height="45" rx="6" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="110" y="457" text-anchor="middle" font-weight="bold" font-size="10" fill="#333">Key Vault</text>
  <text x="110" y="471" text-anchor="middle" font-size="9" fill="#555">Secrets</text>

  <rect x="195" y="435" width="140" height="45" rx="6" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="265" y="457" text-anchor="middle" font-weight="bold" font-size="10" fill="#333">Managed Identity</text>
  <text x="265" y="471" text-anchor="middle" font-size="9" fill="#555">Entra ID</text>

  <rect x="350" y="435" width="140" height="45" rx="6" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="420" y="457" text-anchor="middle" font-weight="bold" font-size="10" fill="#333">Container Registry</text>
  <text x="420" y="471" text-anchor="middle" font-size="9" fill="#555">ACR</text>

  <rect x="505" y="435" width="140" height="45" rx="6" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="575" y="457" text-anchor="middle" font-weight="bold" font-size="10" fill="#333">Log Analytics</text>
  <text x="575" y="471" text-anchor="middle" font-size="9" fill="#555">+ Grafana</text>
</svg>

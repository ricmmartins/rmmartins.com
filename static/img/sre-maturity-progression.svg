<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c8ebf"/>
      <stop offset="100%" style="stop-color:#82b366"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" rx="12" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="600" fill="#2d3436">SRE maturity progression</text>
  <rect x="40" y="60" width="160" height="200" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="120" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#b85450">Level 1</text>
  <text x="120" y="112" text-anchor="middle" font-size="12" fill="#333">Manual</text>
  <text x="120" y="135" text-anchor="middle" font-size="11" fill="#666">Firefighting</text>
  <text x="120" y="155" text-anchor="middle" font-size="11" fill="#666">No runbooks</text>
  <text x="120" y="175" text-anchor="middle" font-size="11" fill="#666">Alert fatigue</text>
  <text x="120" y="195" text-anchor="middle" font-size="11" fill="#666">Tribal knowledge</text>
  <rect x="230" y="60" width="160" height="200" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="310" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#d6b656">Level 2</text>
  <text x="310" y="112" text-anchor="middle" font-size="12" fill="#333">Automated</text>
  <text x="310" y="135" text-anchor="middle" font-size="11" fill="#666">Basic alerting</text>
  <text x="310" y="155" text-anchor="middle" font-size="11" fill="#666">Runbooks exist</text>
  <text x="310" y="175" text-anchor="middle" font-size="11" fill="#666">Some automation</text>
  <text x="310" y="195" text-anchor="middle" font-size="11" fill="#666">Documented processes</text>
  <rect x="420" y="60" width="160" height="200" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="500" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#6c8ebf">Level 3</text>
  <text x="500" y="112" text-anchor="middle" font-size="12" fill="#333">Reactive AI</text>
  <text x="500" y="135" text-anchor="middle" font-size="11" fill="#666">SRE Agent core</text>
  <text x="500" y="155" text-anchor="middle" font-size="11" fill="#666">Auto root cause</text>
  <text x="500" y="175" text-anchor="middle" font-size="11" fill="#666">Memory across</text>
  <text x="500" y="195" text-anchor="middle" font-size="11" fill="#666">incidents</text>
  <rect x="610" y="60" width="160" height="200" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="690" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#82b366">Level 4</text>
  <text x="690" y="112" text-anchor="middle" font-size="12" fill="#333">Proactive AI</text>
  <text x="690" y="135" text-anchor="middle" font-size="11" fill="#666">Custom Skills</text>
  <text x="690" y="155" text-anchor="middle" font-size="11" fill="#666">Scheduled audits</text>
  <text x="690" y="175" text-anchor="middle" font-size="11" fill="#666">Governance scores</text>
  <text x="690" y="195" text-anchor="middle" font-size="11" fill="#666">Preventive ops</text>
  <polygon points="200,285 600,285 600,275 620,290 600,305 600,295 200,295" fill="url(#arrow)" opacity="0.7"/>
  <text x="410" y="315" text-anchor="middle" font-size="11" fill="#666">Skills Pack fills the Level 3 to Level 4 gap</text>

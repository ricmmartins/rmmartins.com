<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#82b366"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6b656"/>
    </marker>
  </defs>

  <text x="300" y="24" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a3a5c">Spillover Architecture</text>

  <rect x="200" y="40" width="200" height="50" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="300" y="62" text-anchor="middle" font-weight="bold" font-size="12" fill="#1a3a5c">Incoming Traffic</text>
  <text x="300" y="78" text-anchor="middle" font-size="10" fill="#555">All API requests</text>

  <line x1="300" y1="90" x2="300" y2="130" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="135" width="360" height="80" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="300" y="160" text-anchor="middle" font-weight="bold" font-size="13" fill="#2d5a1b">PTU (Primary)</text>
  <text x="300" y="178" text-anchor="middle" font-size="10" fill="#555">Guaranteed latency, fixed throughput</text>
  <text x="300" y="193" text-anchor="middle" font-size="10" fill="#555">Handles baseline load</text>

  <line x1="300" y1="215" x2="300" y2="250" stroke="#d6b656" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-orange)"/>
  <text x="370" y="237" font-size="10" fill="#7a5900" font-style="italic">overflow (429)</text>

  <rect x="120" y="255" width="360" height="55" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="300" y="278" text-anchor="middle" font-weight="bold" font-size="13" fill="#7a5900">PAYGO (Spillover)</text>
  <text x="300" y="296" text-anchor="middle" font-size="10" fill="#555">Absorbs spikes, no capacity ceiling</text>

  <rect x="15" y="140" width="85" height="30" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="57" y="159" text-anchor="middle" font-size="9" fill="#2d5a1b">~70-85% load</text>

  <rect x="15" y="265" width="85" height="30" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="57" y="284" text-anchor="middle" font-size="9" fill="#7a5900">Peaks only</text>
</svg>

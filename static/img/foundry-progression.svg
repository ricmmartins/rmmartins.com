<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8ebf"/>
    </marker>
  </defs>

  <text x="340" y="20" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a3a5c">POC to Production</text>

  <rect x="10" y="40" width="120" height="55" rx="6" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <text x="70" y="60" text-anchor="middle" font-weight="bold" font-size="11" fill="#333">Week 1-2</text>
  <text x="70" y="76" text-anchor="middle" font-size="9" fill="#555">Playground</text>
  <text x="70" y="88" text-anchor="middle" font-size="9" fill="#555">Prove the concept</text>

  <line x1="130" y1="67" x2="148" y2="67" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="150" y="40" width="120" height="55" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="210" y="60" text-anchor="middle" font-weight="bold" font-size="11" fill="#1a3a5c">Week 3-4</text>
  <text x="210" y="76" text-anchor="middle" font-size="9" fill="#555">PAYGO Standard</text>
  <text x="210" y="88" text-anchor="middle" font-size="9" fill="#555">Build app logic</text>

  <line x1="270" y1="67" x2="288" y2="67" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="290" y="40" width="120" height="55" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="350" y="60" text-anchor="middle" font-weight="bold" font-size="11" fill="#1a3a5c">Month 2</text>
  <text x="350" y="76" text-anchor="middle" font-size="9" fill="#555">PAYGO + monitoring</text>
  <text x="350" y="88" text-anchor="middle" font-size="9" fill="#555">Real usage patterns</text>

  <line x1="410" y1="67" x2="428" y2="67" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="430" y="40" width="120" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="490" y="60" text-anchor="middle" font-weight="bold" font-size="11" fill="#2d5a1b">Month 3</text>
  <text x="490" y="76" text-anchor="middle" font-size="9" fill="#555">PTU Monthly</text>
  <text x="490" y="88" text-anchor="middle" font-size="9" fill="#555">Lock in savings</text>

  <line x1="550" y1="67" x2="568" y2="67" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="570" y="40" width="100" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="620" y="60" text-anchor="middle" font-weight="bold" font-size="11" fill="#2d5a1b">Month 6+</text>
  <text x="620" y="76" text-anchor="middle" font-size="9" fill="#555">PTU Yearly</text>
  <text x="620" y="88" text-anchor="middle" font-size="9" fill="#555">Max discount</text>

  <text x="340" y="130" text-anchor="middle" font-size="11" fill="#555" font-style="italic">Each phase teaches you something about your workload.</text>
  <text x="340" y="148" text-anchor="middle" font-size="11" fill="#555" font-style="italic">Do not skip steps.</text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <title>{{ .Title }}</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    body {
      margin: 0;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    header { padding: 16px 24px; }
    h1 { margin: 0 0 12px; font-size: 1.25rem; }
    nav { display: flex; gap: 16px; flex-wrap: wrap; }
    a { color: var(--cp-link); }
    a:focus-visible { outline: 2px solid var(--cp-accent); outline-offset: 4px; }
    [hidden] { display: none; }
    object { display: block; width: 100%; height: calc(100vh - 112px); height: calc(100dvh - 112px); min-height: 320px; border: 0; }
    p { padding: 0 24px; }
  </style>
</head>
<body>
  <header>
    <h1>Ricardo Martins - Resume</h1>
    <nav aria-label="PDF actions">
      <a id="open-pdf" target="_blank" rel="noopener noreferrer nofollow" hidden>Open PDF</a>
      <a id="download-pdf" download="ricardo-nvidia.pdf" rel="nofollow" hidden>Download PDF</a>
    </nav>
  </header>
  <main>
    <noscript><p>Please enable JavaScript to view or download this PDF.</p></noscript>
    <object id="resume" type="application/pdf" aria-label="Ricardo Martins resume" hidden>
      <p>Your browser cannot display the PDF inline. Use Open PDF or Download PDF above.</p>
    </object>
  </main>
  {{- /* Embed the PDF without publishing a separate, indexable PDF URL. */ -}}
  {{- $pdf := resources.Get "documents/ricardo-nvidia.pdf" -}}
  <script id="pdf-data" type="application/octet-stream">{{ $pdf.Content | base64Encode | safeHTML }}</script>
  <script>
    const bytes = Uint8Array.from(atob(document.getElementById("pdf-data").textContent.trim()), char => char.charCodeAt(0));
    const pdfUrl = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    for (const id of ["open-pdf", "download-pdf"]) {
      const link = document.getElementById(id);
      link.href = pdfUrl;
      link.hidden = false;
    }
    const viewer = document.getElementById("resume");
    viewer.data = pdfUrl;
    viewer.hidden = false;
  </script>
</body>
</html>

{{- /* Hreflang tags for multilingual SEO (EN ↔ PT) */ -}}
{{- if .IsHome }}
<link rel="alternate" hreflang="en" href="https://rmmartins.com/" />
<link rel="alternate" hreflang="pt-BR" href="https://ricardomartins.com.br/" />
<link rel="alternate" hreflang="x-default" href="https://rmmartins.com/" />
{{- else if .Params.translationKey }}
<link rel="alternate" hreflang="en" href="{{ .Permalink }}" />
<link rel="alternate" hreflang="pt-BR" href="https://ricardomartins.com.br/{{ .Params.translationKey }}/" />
<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}" />
{{- end }}

{{- if eq site.Params.env "production" }}
{{- /* Auto-inject in-article ad after the 3rd heading (h2/h3) in post content.
       This ensures every post gets a mid-content ad without manual shortcode insertion. */ -}}
<script>
(function() {
  var content = document.querySelector('.post-content');
  if (!content) return;
  var headings = content.querySelectorAll('h2, h3');
  if (headings.length < 3) return;
  var target = headings[2];
  var adDiv = document.createElement('div');
  adDiv.className = 'ad-container ad-in-article';
  adDiv.innerHTML = '<ins class="adsbygoogle" style="display:block; text-align:center;" data-ad-layout="in-article" data-ad-format="fluid" data-ad-client="ca-pub-3342746013953954" data-ad-slot="6031547725"></ins>';
  target.parentNode.insertBefore(adDiv, target);
  (adsbygoogle = window.adsbygoogle || []).push({});
})();
</script>
{{- end }}
